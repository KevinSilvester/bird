[package]
name = "bird"
version = "0.8.4"
edition = "2021"
authors = ["Kevin Silvester"]
description = "An installation organizer of sorts"
repository = "https://github.com/KevinSilvester/bird"
homepage = "https://github.com/KevinSilvester/bird"
readme = "README.md"
license-file = "LICENSE.txt"
include = [ 
   "README.md",
   "Cargo.toml", 
   "LICENSE.txt", 
   "src/**/*"
]

[package.metadata.wix]
upgrade-guid = "D3F8321B-26E4-4432-8ED9-C82ED86CCB71"
path-guid = "62CDEF3B-A91E-43EF-81B7-B42E503C92FD"
license = false
eula = false

[dependencies]
ansi_term = "0.12.1"
serde = { version = "1.0.139", features = ["derive"] }
serde_json = "1.0.82"
format_serde_error = "0.3.0"
clap = { version = "3.2.11", features = ["derive", "env"] }
dialoguer = "0.10.1"
log = "0.4.17"
fern = "0.6.1"
chrono = { version = "0.4.19", features = ["serde"] }
dirs = "4.0.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.8.0"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
pr-run-mode = "plan"
